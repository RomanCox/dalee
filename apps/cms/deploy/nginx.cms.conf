# Reverse-proxy для Strapi (cms.romancox.dev) -> локальный процесс на 127.0.0.1:1337.
# Кладётся рядом с существующими server-блоками (например, тем, что обслуживает
# admin.romancox.dev), НЕ вместо них. Порт 80 нужен на время выпуска сертификата —
# certbot --nginx сам допишет redirect на 443 после успешного выпуска.
#
# Установка:
#   sudo cp nginx.cms.conf /etc/nginx/sites-available/cms.romancox.dev
#   sudo ln -s /etc/nginx/sites-available/cms.romancox.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cms.romancox.dev

server {
    listen 80;
    listen [::]:80;
    server_name cms.romancox.dev;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strapi admin использует websocket-подобные long-poll запросы в некоторых плагинах.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 50M; # запас под загрузку медиа через админку
}
